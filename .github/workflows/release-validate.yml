name: Release Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: packages/evolit/.nvmrc
          package-manager-cache: false
      - name: Enable Yarn
        run: corepack enable
      - name: Install dependencies
        run: corepack yarn install --immutable
      - name: Detect pending changesets
        id: pending
        run: |
          if find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' -print -quit | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Materialize release versions
        if: steps.pending.outputs.has_changesets == 'true'
        run: corepack yarn changeset:version
      - name: Refresh lockfile after versioning
        if: steps.pending.outputs.has_changesets == 'true'
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false
        run: corepack yarn install
      - name: Validate packages
        run: corepack yarn release:check
